# /home/deep/esp32-tests/espsdtest/espsdtest-tester/Cargo.toml
[package]
name = "espsdtest-tester"
version = "0.1.0"
edition = "2021"

[dependencies]
btleplug = { version = "0.11", features = ["serde"] } # BLE client library

reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] } # Still needed by reqwest
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
rand = "0.8"
hex = "0.4"
futures = "0.3.31"
uuid = "1.16.0"
# Add other host-only dependencies here if needed
